name: Publish extension

# Publishes a maintainer-built VSIX to the Visual Studio Marketplace with
# Marketplace Trusted Publishing (OIDC). No PAT and no OAuth credentials are
# stored in this repository or in GitHub secrets: the workflow only downloads
# the VSIX asset that the release already carries.
#
# Setup (once, by the publisher):
#   1. https://marketplace.visualstudio.com/manage/publishers/lutfi -> Trusted Publishing
#   2. Policy: repository owner `lutfi238`, repository
#      `antigravity-for-copilot-vscode`, workflow `publish.yml`, environment empty.
#
# Release flow:
#   1. Bump the version, run `npm run package:vsix` locally.
#   2. Create a GitHub release and attach the generated .vsix asset.
#   3. This workflow publishes that exact asset.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that carries the packaged VSIX asset
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Visual Studio Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the packaged VSIX from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-asset
          gh release download "$TAG" --pattern '*.vsix' --dir release-asset
          ls -l release-asset

      - name: Verify the VSIX matches this checkout
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="antigravity-for-copilot-${version}.vsix"
          count="$(find release-asset -maxdepth 1 -type f -name '*.vsix' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one VSIX asset, found $count." >&2
            exit 1
          fi
          if [ ! -f "release-asset/${expected}" ]; then
            echo "Release asset does not match package.json version ${version}." >&2
            echo "Found: $(find release-asset -maxdepth 1 -type f -name '*.vsix' -printf '%f ')" >&2
            exit 1
          fi
          echo "Verified release-asset/${expected}"

      - name: Publish with Trusted Publishing (OIDC)
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath release-asset/*.vsix
